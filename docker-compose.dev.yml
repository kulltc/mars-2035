services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    environment:
      MARS_SERVER_URL: http://server:3000
      MCP_BASE_URL: https://test.mars-2034.online
      MCP_PORT: "3001"
      DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - server
      - mcp-server

  agent-admin:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file:
      - agent/.env
    environment:
      GAME_SERVER_URL: http://server:3000
      MCP_SERVER_URL: http://mcp-server:3001/mcp
    volumes:
      - agent-data:/app/agent/data
    depends_on:
      - server
      - mcp-server

volumes:
  pgdata-dev:
  agent-data:
