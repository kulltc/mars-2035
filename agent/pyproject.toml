[project]
name = "mars2035-agent"
version = "0.1.0"
description = "Autonomous agents that play Mars 2035 via MCP"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain-mcp-adapters",
    "langchain-anthropic",
    "click",
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
